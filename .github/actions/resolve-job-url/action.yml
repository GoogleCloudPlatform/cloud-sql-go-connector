name: Resolve Job URL
description: Resolves the GitHub Actions job html_url for the active matrix job, with fallback to the workflow run URL.

inputs:
  job-name:
    description: Expected job name in the GitHub Actions Jobs API.
    required: true
  github-token:
    description: GitHub token with actions:read permission.
    required: false
    default: ${{ github.token }}

outputs:
  build_url:
    description: Resolved job html_url or workflow run fallback URL.
    value: ${{ steps.resolve.outputs.result }}

runs:
  using: composite
  steps:
    - name: Resolve job URL
      id: resolve
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        EXPECTED_JOB_NAME: ${{ inputs.job-name }}
        RUNNER_NAME: ${{ runner.name }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
        SERVER_URL: ${{ github.server_url }}
        FALLBACK_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        ACTION_PATH: ${{ github.action_path }}
      with:
        github-token: ${{ inputs.github-token }}
        result-encoding: string
        retries: "2"
        script: |
          const path = require('path');
          const resolveJobUrl = require(path.join(process.env.ACTION_PATH, 'resolve-job-url.js'));
          return await resolveJobUrl({ github, context, core, env: process.env });
